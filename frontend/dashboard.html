<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Customer Segmentation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎯 Customer Segmentation Dashboard</h1>
        <a href="index.html" class="back-btn">← Back to Home</a>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processing data...</p>
        </div>

        <div id="dashboard" style="display: none;">
            <!-- Stats Overview -->
            <div class="stats-overview">
                <div class="stat-card">
                    <h3>Total Customers</h3>
                    <p id="total-customers">0</p>
                </div>
                <div class="stat-card">
                    <h3>Clusters Found</h3>
                    <p id="total-clusters">0</p>
                </div>
                <div class="stat-card">
                    <h3>Avg Income (k$)</h3>
                    <p id="avg-income">0</p>
                </div>
                <div class="stat-card">
                    <h3>Avg Spending Score</h3>
                    <p id="avg-spending">0</p>
                </div>
            </div>

            <!-- Visualization -->
            <div class="chart-container">
                <h2>📊 Cluster Visualization</h2>
                <canvas id="clusterChart"></canvas>
            </div>

            <!-- Cluster Statistics -->
            <div class="cluster-stats">
                <h2>📈 Cluster Analysis</h2>
                <div id="cluster-cards" class="cluster-cards"></div>
            </div>

            <!-- Search & Export -->
            <div class="actions-bar">
                <input type="text" id="search-input" placeholder="🔍 Search customers..." />
                <button onclick="exportToCSV()" class="export-btn">📥 Export CSV</button>
            </div>

            <!-- Customers Table -->
            <div class="table-container">
                <h2>👥 All Customers</h2>
                <table id="customers-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Gender</th>
                            <th>Age</th>
                            <th>Annual Income (k$)</th>
                            <th>Spending Score</th>
                            <th>Cluster</th>
                        </tr>
                    </thead>
                    <tbody id="customers-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Customer Details</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
